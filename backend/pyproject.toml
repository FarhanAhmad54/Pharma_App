[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-management-backend"
version = "0.1.0"
description = "Pharmaceutical operations and ERP backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "email-validator>=2.2,<3",
  "pyjwt>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "pyright>=1.1,<2",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]

[project.scripts]
pharma = "pharma_management.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F"]
per-file-ignores = {"src/pharma_management/services.py" = ["F401"]}

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["src"]
