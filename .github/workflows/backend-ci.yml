name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pharma
          POSTGRES_PASSWORD: pharma
          POSTGRES_DB: pharma_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharma -d pharma_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://pharma:pharma@localhost:5432/pharma_ci
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      ENVIRONMENT: testing
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install '.[dev]'
      - run: ruff check src tests
      - run: pyright src tests
      - run: alembic upgrade head
      - run: pytest -q
